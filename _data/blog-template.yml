# Blog Post - SEO and Social Sharing Metadata

title: "Blog Post Title"

description: >-
    Write a concise description of this blog post for search engines.
    Summarise the main topic and include relevant context.

date: "YYYY-MM-DDTHH:MM:SSZ"
last_modified: "YYYY-MM-DDTHH:MM:SSZ"

author: "Madhurima Rawat"
robots: "index, follow"

keywords: >-
    keyword one, keyword two, keyword three

# Open Graph Metadata
og_title: "Blog Post Title | Madhurima Rawat"
og_type: "article"

og_description: >-
    Write a short and engaging description for social sharing.

image: "https://example.com/path/to/social-image.jpg"
image_alt: "Describe the social-sharing image"
image_width: 1200
image_height: 630

og_site_name: "Madhurima Mindscape"

# Twitter/X Card Metadata
twitter_card: "summary_large_image"
twitter_title: "Blog Post Title | Madhurima Rawat"

twitter_description: >-
    Write a short and engaging description for Twitter/X sharing.

twitter_image: "https://example.com/path/to/social-image.jpg"

# Favicon
favicon: "images/Logo.png"
