<!--
*********************************************************************************************
* File: picture-gallery.html
* Author: Madhurima Rawat
* Date: November 25, 2026
* Description: Defines the shared layout for all blog pages, automatically positioning
*              the Post Actions component immediately after the blog's top section.
* Version: 1.0
* GitHub Repository: https://github.com/madhurimarawat/Madhurima-Mindscape
* Comments:
*     - Uses Jekyll Liquid to separate content around the closing </top> tag.
*     - Automatically inserts the Post Actions component using the page permalink as its CSS class.
*     - Includes shared imports, navigation header, blog content, and footer.
*     - Eliminates repetitive component markup across individual blog pages.
*********************************************************************************************
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Common Blog Imports -->
    {% include imports/blog.html %}

    <!-- Gallery Stylesheet -->
    <link rel="stylesheet" href="{{ '/css/picture-gallery.css' | relative_url }}">

    <!-- Embedded Gallery JSON Data -->

    <script type="application/json" id="galleryData">
            {{ site.data.json.images_preview_links | jsonify }}
        </script>


    <!-- Gallery JavaScript -->

    <script src="{{ '/js/picture-gallery.js' | relative_url }}"></script>
</head>

<body>

    <!-- Header -->
    <div id="header-container">
        {% include components/header.html %}
    </div>

    <!-- Blog Content -->
    <main>

        {{content}}

    </main>

    <!-- Footer -->
    <div id="footer-container">
        {% include components/footer.html %}
    </div>

    <!-- Language Toggle Button -->
    <button id="language-toggle" class="language-toggle ignore" type="button">
        <i class="fa-solid fa-language language-icon"></i>
        <span class="language-text">Lang</span>
    </button>

    <div id="translate-container" class="translate-container">
    </div>

</body>

</html>
