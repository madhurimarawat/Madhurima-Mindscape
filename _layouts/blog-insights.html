<!DOCTYPE html>
<html lang="en">

<head>
    {% include imports/blog-insights.html %}
</head>

<body>

    <!-- Header -->
    <div id="header-container">
        {% include components/header.html %}
    </div>

    <!-- Blog Content -->
    <main>

        {{content}}
    </main>

    <!-- Footer -->
    <div id="footer-container">
        {% include components/footer.html %}
    </div>

</body>

</html>
